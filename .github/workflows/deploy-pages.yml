# Builds the site as static pages and publishes it to GitHub Pages (olytron.com).
# Runs on every push to main, including changes synced from Lovable.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun.lock points at Lovable's private package cache, which GitHub can't
      # reach, so install from the public npm registry instead.
      - name: Install dependencies
        run: |
          rm -f bun.lock package-lock.json
          npm install --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build static site
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            msg=$(grep -v '^\s*$' build.log | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          fi
          exit $status

      - name: Locate static output
        id: out
        run: |
          DIR=$(dirname "$(find . -path ./node_modules -prune -o -name index.html -print \
            | xargs grep -l "Senior Instructional Designer" 2>/dev/null \
            | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)")
          echo "Static output: $DIR"
          ls -la "$DIR"
          tree=$(cd "$DIR" && find . -name '*.html' | sort | head -40 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Static output in ${DIR}::${tree}"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Render favicon.ico and apple-touch-icon.png from favicon.svg
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          sudo apt-get install -y -qq librsvg2-bin imagemagick > /dev/null
          T=$(mktemp -d)
          for s in 16 32 48; do rsvg-convert -w $s -h $s public/favicon.svg -o "$T/$s.png"; done
          convert "$T/16.png" "$T/32.png" "$T/48.png" "$DIR/favicon.ico"
          # favicon.svg is transparent; the home-screen icon gets a dark square tile
          # (iOS rounds the corners itself) with a smaller ship and lighter outline.
          sed -e 's#</defs>#</defs><rect width="1000" height="1000" fill="\#18100a"/>#' \
              -e 's/scale(1.12) translate(-534 -505)/scale(0.9) translate(-534 -505)/' \
              -e 's/stroke="\#6b655e" stroke-width="16"/stroke="\#bebab4" stroke-width="10"/' \
              public/favicon.svg > "$T/square.svg"
          grep -q 'fill="#18100a"' "$T/square.svg" || { echo "::error::tile not added"; exit 1; }
          rsvg-convert -w 180 -h 180 "$T/square.svg" -o "$DIR/apple-touch-icon.png"
          echo "::notice title=Favicons::$(identify "$DIR/favicon.ico" "$DIR/apple-touch-icon.png" | awk '{print $1, $3}' | tr '\n' ';')"

      - name: Check every page and image is present
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          cp public/CNAME public/.nojekyll "$DIR"/ 2>/dev/null || true
          fail=0
          for p in case-studies about contact supporting-work \
                   case-studies/water-works-for-kids case-studies/xr-safety-simulation \
                   case-studies/wellness-micro-learning case-studies/immersive-storytelling-curriculum \
                   case-studies/storyline-360-interactives; do
            if [ -f "$DIR/$p/index.html" ] || [ -f "$DIR/$p.html" ]; then echo "ok   page /$p"
            else echo "::error::MISSING page /$p"; fail=1; fi
          done
          for img in $(grep -rhoE '/images/[A-Za-z0-9_.-]+' src | sort -u); do
            if [ -f "$DIR$img" ]; then echo "ok   $img"; else echo "::error::MISSING $img"; fail=1; fi
          done
          for f in CNAME favicon.svg favicon.ico apple-touch-icon.png; do [ -f "$DIR/$f" ] || { echo "::error::MISSING $f"; fail=1; }; done
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
